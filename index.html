if(tab==='fleet')body=`<div class="block"><h3>船队及在手订单 · 原始Excel</h3>${field('现有船队',N(o.fleet)+' 艘')}${field('在手订单',N(o.order)+' 艘')}${field('合计',N(o.total)+' 艘')}${field('总运力/吨位',N(o.dwt)+' '+(o.unit||''))}${field('平均船龄',o.age?Number(o.age).toFixed(1)+' 年':null)}</div><div class="block"><h3>订单补充说明</h3><p>${E(x.orderNotes||'尚未补充逐船订单、船厂、交付年份和订单日期。')}</p></div><p class="foot">注意：船队及订单数量为上传Excel的原始口径，未核验是否为实益所有、商业管理或技术管理船队。</p>`;
if(tab==='lease'||tab==='news'){const arr=Array.isArray(x[tab])?x[tab]:[];body=`<div class="block"><h3>${tab==='lease'?'租赁公司合作记录':'最新公开资讯'}</h3>${arr.length?arr.map(a=>`<div style="border-top:1px solid var(--line);padding:12px 0"><b>${E(a.title||'未命名记录')}</b><div class="muted">${E(a.date||'日期待核实')}</div><p>${E(a.details||'')}</p>${source(a.url)}</div>`).join(''):`<div class="empty">尚无已核实记录。点击“编辑档案”添加带来源的记录。</div>`}</div>`}
if(tab==='edit'){const fields=[['type','公司类型'],['founded','成立时间'],['registered','注册地'],['assets','资产规模'],['background','公司背景（简短）'],['financeDisclosure','财务公开情况'],['financeSummary','财务情况一句话'],['financeYear','财务年度'],['totalAssets','总资产'],['revenue','营业收入'],['profit','净利润'],['financeSource','财务信息来源网址'],['orderNotes','订单补充说明']];body=`<div class="block editor"><h3>编辑 ${E(o.name)} 的补充资料</h3><p class="foot">本地编辑仅影响当前浏览器。每条合作/新闻一行，格式：日期 | 标题 | 详情 | 来源网址。不要填写未经核实的事实。</p>${fields.map(([k,label])=>`<label>${E(label)}</label>${['background','financeSummary','orderNotes'].includes(k)?`<textarea data-field="${k}">${E(x[k]||'')}</textarea>`:`<input type="text" data-field="${k}" value="${E(x[k]||'')}">`}`).join('')}<label>租赁合作记录（每行一条）</label><textarea id="leaseInput" style="min-height:115px">${E((x.lease||[]).map(a=>[a.date,a.title,a.details,a.url].join(' | ')).join('\n'))}</textarea><label>最新资讯（每行一条）</label><textarea id="newsInput" style="min-height:115px">${E((x.news||[]).map(a=>[a.date,a.title,a.details,a.url].join(' | ')).join('\n'))}</textarea><div class="actions"><button class="btn" id="saveProfile">保存到本机</button><button class="btn" id="cancelEdit">返回档案</button></div></div>`}
$('profile').innerHTML=`<div class="profilehead"><div class="eyebrow">SHIPOWNER PROFILE</div><h2>${E(o.name)}</h2><span class="pill">${E(o.country)}</span> <span class="pill">原表排名 #${E(o.rank)}</span></div><div class="tabs">${tabs.map(([id,label])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</div>${body}<p class="foot">来源：用户上传的船东名录；补充资料为本机手动维护。空缺信息不代表该公司不存在相关业务。</p>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderProfile()});if(tab==='edit'){$('cancelEdit').onclick=()=>{tab='overview';renderProfile()};$('saveProfile').onclick=()=>{const y={...x};document.querySelectorAll('[data-field]').forEach(el=>y[el.dataset.field]=el.value.trim());const parse=id=>$(id).value.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{const p=line.split('|').map(s=>s.trim());return {date:p[0]||'',title:p[1]||'',details:p[2]||'',url:p[3]||''}});y.lease=parse('leaseInput');y.news=parse('newsInput');extra[key(o)]=y;if(save()){tab='overview';renderProfile();alert('已保存到当前浏览器。建议定期导出JSON备份。')}}}}
$('q').oninput=renderList;$('sort').onchange=renderList;
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),profiles:extra},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shipowner-profiles.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text()),p=j.profiles||j;if(!p||typeof p!=='object'||Array.isArray(p))throw Error('JSON格式错误');if(!confirm('导入将覆盖当前浏览器中的补充资料，是否继续？'))return;extra=p;save();renderProfile();alert('导入成功')}catch(err){alert('导入失败：'+err.message)}e.target.value=''};
function renderMarkers(){const layer=$('mapMarkers');layer.innerHTML=names.map(c=>{const v=coords[c],x=(v[1]+180)*1200/360,y=(90-v[0])*580/180,n=owners.filter(o=>o.country===c).length,active=country===c;return `<g class="marker ${active?'chosen':''}" data-mapcountry="${E(c)}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})" role="button" tabindex="0" aria-label="${E(c)} ${n}家船东"><circle class="halo" r="${active?25:20}"/><circle class="ring" r="${active?13:10}"/><circle class="core" r="4"/><text y="-20" text-anchor="middle" class="marker-label">${E(c)} · ${n}</text></g>`}).join('');layer.querySelectorAll('[data-mapcountry]').forEach(el=>{const go=()=>setCountry(el.dataset.mapcountry);el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}})}
function openProfile(){$('rightPanel').classList.add('open');$('rightPanel').scrollTop=0}
$('closeProfile').onclick=()=>$('rightPanel').classList.remove('open');
$('resetMap').onclick=()=>setCountry('');

renderCountries();renderList();renderMarkers();current=owners[0];renderProfile();
</script></body></html>
