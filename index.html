const $=id=>document.getElementById(id), E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])),N=x=>x===null||x===undefined||x===''?'未披露':Number(x).toLocaleString('zh-CN',{maximumFractionDigits:1});
const key=o=>o.country+'|'+o.name;let extra={};try{extra=JSON.parse(localStorage.getItem('shipowners-v2')||'{}')}catch(e){}let current=null,country='',tab='overview',map,riskSheets=[];
const names=[...new Set(owners.map(o=>o.country))];$('nOwner').textContent=owners.length;$('nCountry').textContent=names.length;$('nFleet').textContent=N(owners.reduce((n,o)=>n+(+o.fleet||0),0));
function save(){try{localStorage.setItem('shipowners-v2',JSON.stringify(extra));return true}catch(e){alert('浏览器存储失败，请及时导出JSON备份');return false}}
function setCountry(c){country=c;renderCountries();renderList();if(c&&map)map.flyTo(coords[c],5,{duration:.5})}
function renderCountries(){$('countries').innerHTML=`<button class="country ${!country?'active':''}" data-c="">全部国家 <span class="pill">${owners.length}</span></button>`+names.map(c=>`<button class="country ${country===c?'active':''}" data-c="${E(c)}">${E(c)} <span class="pill">${owners.filter(o=>o.country===c).length}</span></button>`).join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>setCountry(b.dataset.c))}
function renderList(){const q=$('q').value.trim().toLowerCase(),sort=$('sort').value;let arr=owners.filter(o=>(!country||o.country===country)&&[o.name,o.country,o.city,o.region].some(v=>String(v||'').toLowerCase().includes(q)));arr.sort((a,b)=>sort==='fleet'?(+b.fleet||0)-(+a.fleet||0):sort==='order'?(+b.order||0)-(+a.order||0):a.country.localeCompare(b.country,'zh')||(+a.rank)-(+b.rank));$('listStatus').textContent=`匹配 ${arr.length} 家船东 · 点击查看档案`;$('list').innerHTML=arr.map(o=>`<button class="owner ${current===o?'selected':''}" data-i="${owners.indexOf(o)}"><b>${E(o.name)}</b><small>${E(o.country)} · 排名 ${E(o.rank)}</small><br><small>船队 <span class="count">${N(o.fleet)}</span> 艘　订单 <span class="count">${N(o.order)}</span> 艘</small></button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{current=owners[+b.dataset.i];tab='overview';renderList();renderProfile()})}
function field(k,v){return `<div class="kv"><span>${E(k)}</span><strong>${v===undefined||v===null||v===''?'待补充':E(v)}</strong></div>`}
function source(s){const u=String(s||'');return /^https?:\/\/[^\s"<>]+$/i.test(u)?`<a class="link" target="_blank" rel="noopener noreferrer" href="${E(u)}">信息来源 ↗</a>`:'<span class="muted">来源待补充</span>'}
function get(){return extra[key(current)]||{}}
function renderProfile(){if(!current)return;const o=current,x=get();const tabs=[['overview','公司概况'],['fleet','船队订单'],['lease','租赁合作'],['news','最新资讯'],['edit','编辑档案']];let body='';
if(tab==='overview')body=`<div class="block"><h3>公司背景</h3><p>${E(x.background||'公司背景尚待核实。可补充成立时间、注册地、发展历程、主要业务及行业地位。')}</p>${field('公司类型',x.type)}${field('成立时间',x.founded)}${field('注册地',x.registered||o.region)}${field('资产规模',x.assets)}${field('所在城市',o.city)}${field('原表平均船龄',o.age?Number(o.age).toFixed(1)+' 年':null)}${o.web&&/^https?:\/\//.test(o.web)?`<p>${source(o.web)}</p>`:''}</div><div class="block"><h3>财务信息</h3><p>${E(x.financeSummary||'暂未完成公开财务信息核实。')}</p>${field('公开披露情况',x.financeDisclosure||'待核实')}${field('最近披露年度',x.financeYear)}${field('总资产',x.totalAssets)}${field('营业收入',x.revenue)}${field('净利润',x.profit)}<p>${source(x.financeSource)}</p></div>`;
if(tab==='fleet')body=`<div class="block"><h3>船队及在手订单 · 原始Excel</h3>${field('现有船队',N(o.fleet)+' 艘')}${field('在手订单',N(o.order)+' 艘')}${field('合计',N(o.total)+' 艘')}${field('总运力/吨位',N(o.dwt)+' '+(o.unit||''))}${field('平均船龄',o.age?Number(o.age).toFixed(1)+' 年':null)}</div><div class="block"><h3>订单补充说明</h3><p>${E(x.orderNotes||'尚未补充逐船订单、船厂、交付年份和订单日期。')}</p></div><p class="foot">注意：船队及订单数量为上传Excel的原始口径，未核验是否为实益所有、商业管理或技术管理船队。</p>`;
if(tab==='lease'||tab==='news'){const arr=Array.isArray(x[tab])?x[tab]:[];body=`<div class="block"><h3>${tab==='lease'?'租赁公司合作记录':'最新公开资讯'}</h3>${arr.length?arr.map(a=>`<div style="border-top:1px solid var(--line);padding:12px 0"><b>${E(a.title||'未命名记录')}</b><div class="muted">${E(a.date||'日期待核实')}</div><p>${E(a.details||'')}</p>${source(a.url)}</div>`).join(''):`<div class="empty">尚无已核实记录。点击“编辑档案”添加带来源的记录。</div>`}</div>`}
if(tab==='edit'){const fields=[['type','公司类型'],['founded','成立时间'],['registered','注册地'],['assets','资产规模'],['background','公司背景（简短）'],['financeDisclosure','财务公开情况'],['financeSummary','财务情况一句话'],['financeYear','财务年度'],['totalAssets','总资产'],['revenue','营业收入'],['profit','净利润'],['financeSource','财务信息来源网址'],['orderNotes','订单补充说明']];body=`<div class="block editor"><h3>编辑 ${E(o.name)} 的补充资料</h3><p class="foot">本地编辑仅影响当前浏览器。每条合作/新闻一行，格式：日期 | 标题 | 详情 | 来源网址。不要填写未经核实的事实。</p>${fields.map(([k,label])=>`<label>${E(label)}</label>${['background','financeSummary','orderNotes'].includes(k)?`<textarea data-field="${k}">${E(x[k]||'')}</textarea>`:`<input type="text" data-field="${k}" value="${E(x[k]||'')}">`}`).join('')}<label>租赁合作记录（每行一条）</label><textarea id="leaseInput" style="min-height:115px">${E((x.lease||[]).map(a=>[a.date,a.title,a.details,a.url].join(' | ')).join('\n'))}</textarea><label>最新资讯（每行一条）</label><textarea id="newsInput" style="min-height:115px">${E((x.news||[]).map(a=>[a.date,a.title,a.details,a.url].join(' | ')).join('\n'))}</textarea><div class="actions"><button class="btn" id="saveProfile">保存到本机</button><button class="btn" id="cancelEdit">返回档案</button></div></div>`}
$('profile').innerHTML=`<div class="profilehead"><div class="eyebrow">SHIPOWNER PROFILE</div><h2>${E(o.name)}</h2><span class="pill">${E(o.country)}</span> <span class="pill">原表排名 #${E(o.rank)}</span></div><div class="tabs">${tabs.map(([id,label])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</div>${body}<p class="foot">来源：用户上传的船东名录；补充资料为本机手动维护。空缺信息不代表该公司不存在相关业务。</p>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderProfile()});if(tab==='edit'){$('cancelEdit').onclick=()=>{tab='overview';renderProfile()};$('saveProfile').onclick=()=>{const y={...x};document.querySelectorAll('[data-field]').forEach(el=>y[el.dataset.field]=el.value.trim());const parse=id=>$(id).value.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{const p=line.split('|').map(s=>s.trim());return {date:p[0]||'',title:p[1]||'',details:p[2]||'',url:p[3]||''}});y.lease=parse('leaseInput');y.news=parse('newsInput');extra[key(o)]=y;if(save()){tab='overview';renderProfile();alert('已保存到当前浏览器。建议定期导出JSON备份。')}}}}
$('q').oninput=renderList;$('sort').onchange=renderList;
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),profiles:extra},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shipowner-profiles.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text()),p=j.profiles||j;if(!p||typeof p!=='object'||Array.isArray(p))throw Error('JSON格式错误');if(!confirm('导入将覆盖当前浏览器中的补充资料，是否继续？'))return;extra=p;save();renderProfile();alert('导入成功')}catch(err){alert('导入失败：'+err.message)}e.target.value=''};
if(window.L){map=L.map('map').setView([31,30],2);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:18}).addTo(map);names.forEach(c=>L.circleMarker(coords[c],{radius:10,color:'#6ee5df',fillColor:'#2bb4c0',fillOpacity:.78,weight:2}).addTo(map).bindTooltip(`${c} · ${owners.filter(o=>o.country===c).length}家`).on('click',()=>setCountry(c)))}else{$('map').innerHTML='<p style="padding:30px">地图需要联网加载，船东搜索和档案仍可使用。</p>'}
renderCountries();renderList();current=owners[0];renderProfile();
</script></body></html>
